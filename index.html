<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PHARE — l'usine de développement</title>
<link rel="icon" type="image/svg+xml" href="phare_icon.svg">
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="usine.css">
</head>
<body>
<div id="site-header"></div>
<header class="viewbar">
  <div class="viewbar-title">
    <h1>Chaîne de production</h1>
    <p>Du code livré avec ses preuves, relu par un humain</p>
  </div>
  <div class="viewbar-right">
    <div class="counters">
      <div><span id="c-human">0</span><small>interventions humaines</small></div>
      <div><span id="c-check">0</span><small>contrôles franchis</small></div>
      <div class="fake">valeurs illustratives,<br>aucune mesure réelle</div>
    </div>
    <div class="room">
      <div class="plate"><button id="stop" type="button" class="cap" title="Arrêt d'urgence (RSSI ou adjoint)" aria-label="Arrêt d'urgence"></button></div>
      <small>Arrêt d'urgence · RSSI ou adjoint</small>
    </div>
  </div>
</header>
<div class="states" id="states" aria-label="Étapes de la fabrication"></div>

<div id="stagewrap" class="stagewrap">
  <div id="viewport" class="viewport" aria-label="Chaîne de production, faire défiler horizontalement">
    <svg id="scene" role="img" aria-label="Chaîne de production du logiciel : réception, contrôle d'entrée, bureau d'études, feu vert, atelier robotisé, contrôle de sortie, quai GitLab, livraison"></svg>
  </div>
</div>

<div id="transition" class="transition" aria-live="polite">
  <div class="tcard"><small id="t-count"></small><strong id="t-title"></strong><span id="t-sub"></span><i></i></div>
</div>

<div id="banner" class="banner" hidden>ARRÊT D'URGENCE : la chaîne est à l'arrêt, rien ne part.</div>

<footer class="hud bottom">
  <div class="caption">
    <strong id="cap-title"></strong>
    <span id="cap-sub"></span>
    <a id="cap-link" class="link" href="simulateur.html">Voir ce composant dans le simulateur</a>
  </div>
  <div id="player"></div>
</footer>

<script src="shell.js"></script>
<script src="usine.js"></script>
</body>
</html>
